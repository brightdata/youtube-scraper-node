# The only workflow that calls the real API. Needs the BRIGHTDATA_API_TOKEN
# secret and is billed per video, channel or comment.
#
# Four ways it runs:
#   on every push to main: one video for one keyword and the README's links,
#     one record and about three minutes, so a broken commit shows up at once.
#     A newer push cancels a run still going for an older commit.
#   by hand, from the Actions tab, to search whatever keywords you choose
#   every day at 08:00 UTC except Monday: one video, the async path, and the
#     field tables, about two records
#   every Monday at 08:00 UTC: the same, plus every code block in the README,
#     about 30 records and 15 minutes
#
# Every run also checks, for free and with no secret, that the newest Bright
# Data CLI still accepts every CLI line in the README. Readers run `npx -p
# @brightdata/cli`, which is always the newest release, while the jobs that hold
# the secret run the version pinned in BDATA_CLI below. When it warns about a
# new release, bump BDATA_CLI.
#
# A slow day at the API shows up as a red run. Rerun it before reading more
# into it.
#
# The daily and Monday runs end by rewriting the "last verified" badge line at
# the top of README.md with today's date, and committing it if it changed. Push
# runs never do this, so your own push is never followed by a bot commit. Only
# the main repository commits; a copy of the repository just runs the checks.
name: Live check

run-name: "${{ github.event.schedule == '0 8 * * 1' && 'Weekly check: does every README block still work?' || github.event_name == 'schedule' && 'Daily check: is anything broken?' || github.event_name == 'push' && format('Push check: {0}', github.event.head_commit.message) || format('Search {0}, {1} videos each', inputs.keywords, inputs.limit) }}"

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 0,2-6"  # daily smoke, every day except Monday
    - cron: "0 8 * * 1"    # Monday: the whole README
  workflow_dispatch:
    inputs:
      keywords:
        description: Search keywords, separated by commas
        default: python tutorial, home workout
      limit:
        description: How many videos to fetch for each keyword
        default: "2"
      validate:
        description: Also run every README block, as the Monday run does
        type: boolean
        default: false
      only:
        description: Block numbers to run, comma separated, for a cheap check. Empty means all.
        default: ""

permissions:
  contents: write  # the daily check commits the regenerated field tables

env:
  BDATA_CLI: "0.4.0"  # pinned for the jobs that hold the API secret; bump after cli-syntax passes

concurrency:
  group: live-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}  # only the newest commit matters

jobs:
  scrape:
    name: Search the keywords and attach the videos to this run
    runs-on: ubuntu-latest
    timeout-minutes: 45  # a keyword search took about two minutes live; the README blocks have their own jobs
    env:
      BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
      # On the daily schedule there are no inputs, so fall back to one cheap video.
      KEYWORDS: ${{ inputs.keywords || 'python tutorial' }}
      LIMIT: ${{ inputs.limit || '1' }}
      # the async path and the field tables run on every scheduled run and on request
      CHECK: ${{ github.event_name == 'schedule' || inputs.validate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
      - name: Install the package
        run: npm install

      - name: Do the README's links still resolve?
        run: |
          public=$(curl -s -o /dev/null -w '%{http_code}' https://github.com/brightdata/youtube-scraper-node)
          failed=0
          # the sample excerpt is scraped data: its links belong to video descriptions, not to us
          for url in $(sed '/^```json/,/^```$/d' README.md AGENTS.md | grep -ohE 'https?://[^ )>"`\\]+' | sed 's/[.,]$//' | sort -u); do
            case "$url" in
              *youtube.com/*) continue ;;  # video pages, fetched by the weekly README run anyway
              *zendesk.com/*) continue ;;    # answers 403 to anything that is not a browser
              *mcp.brightdata.com/*) continue ;;  # carries a placeholder token; nothing to check without a real one
              *api.brightdata.com/*) continue ;;  # API endpoints answer 401 without a key; the README blocks call them
              *github.com/brightdata/youtube-scraper*) [ "$public" = "200" ] || continue ;;  # this repo and its Node twin, unreachable while private
            esac
            code=$(curl -s -o /dev/null -L --retry 3 --max-time 30 -A "Mozilla/5.0" -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = "200" ]; then echo "200 $url"; else echo "::error::$code $url"; failed=1; fi
          done
          [ "$failed" = 0 ] || exit 1
      - name: Search YouTube
        run: |
          test -n "$BRIGHTDATA_API_TOKEN" || {
            echo "No API token. Add BRIGHTDATA_API_TOKEN under" >&2
            echo "Settings, Secrets and variables, Actions, then start this again." >&2
            exit 1
          }
          mapfile -t KW < <(python3 -c 'import os; [print(k.strip()) for k in os.environ["KEYWORDS"].split(",") if k.strip()]')
          # One retry, only on an API timeout. A slow day is not a broken build.
          set +e
          node src/cli.js "${KW[@]}" --limit "$LIMIT" 2>&1 | tee run.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ] && grep -qi "timeout" run.log; then
            echo "::warning::The API timed out. Waiting 30s and trying once more."
            sleep 30
            node src/cli.js "${KW[@]}" --limit "$LIMIT" 2>&1 | tee run.log
            code=${PIPESTATUS[0]}
          fi
          exit "$code"

      - name: Show what was found
        if: always()
        run: |
          set -o pipefail
          test -f youtube.json || exit 0
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json

          doc = json.load(open("youtube.json"))
          print(f"Run at {doc['generated_at']}\n")
          print("| keyword | videos | fields |")
          print("| --- | --- | --- |")
          for entry in doc["keywords"]:
              found = entry["videos"]
              print(f"| {entry['keyword']} | {len(found)} | {len(found[0]) if found else 0} |")
          for entry in doc["keywords"]:
              if not entry["videos"]:
                  continue
              print(f"\n### {entry['keyword']}\n")
              print("| title | views | likes | url |")
              print("| --- | --- | --- | --- |")
              for video in entry["videos"]:
                  print(
                      f"| {video.get('title')} | {video.get('views')} "
                      f"| {video.get('likes')} | {video.get('url')} |"
                  )
          first = next((v for e in doc["keywords"] for v in e["videos"]), None)
          if first:
              print("\n<details><summary>First record in full</summary>\n")
              print("```json")
              print(json.dumps(first, indent=2, ensure_ascii=False))
              print("```\n")
              print("</details>")
          PY

      # The two daily checks. Discovery is already covered by the step above.
      - name: Does the async trigger, status, fetch path still work?
        if: env.CHECK == 'true'
        run: |
          set -o pipefail
          node - <<'JS' | tee -a "$GITHUB_STEP_SUMMARY"
          import assert from "node:assert/strict";
          import { CHANNELS, fetchSnapshot, status, trigger } from "@brightdata/youtube-scraper-node";

          const sid = await trigger(CHANNELS, [{ url: "https://www.youtube.com/@NASA/about" }]);
          let state;
          for (let i = 0; i < 90; i += 1) {  // up to 15 minutes
            state = await status(sid);
            if (["ready", "failed"].includes(state)) break;
            await new Promise((done) => setTimeout(done, 10_000));
          }
          assert.equal(state, "ready", `snapshot ${sid} ended as ${state}`);
          const rows = await fetchSnapshot(sid);
          assert.ok(rows.length && rows[0].name, `fetch returned no channel: ${JSON.stringify(rows[0])}`);
          console.log(`\nAsync path ok: trigger, status, fetch returned ${rows.length} record(s).`);
          JS

      - name: Regenerate the README field tables from the live schema
        if: always() && env.CHECK == 'true' && github.repository == 'brightdata/youtube-scraper-node' && github.ref == 'refs/heads/main'
        run: |
          node .github/scripts/field_tables.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          if git diff --quiet README.md; then
            echo "Nothing to commit."
            exit 0
          fi
          # Never commit a README the tests would reject.
          npm test
          git config user.name "anil-bd"
          git config user.email "210667061+anil-bd@users.noreply.github.com"
          git add README.md
          git commit -m "Regenerate the field tables from the live schema (automated daily check)"
          git pull --rebase origin main
          git push
          echo "Committed the regenerated tables."

      - name: Attach youtube.json so you can download it
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: youtube-json
          path: youtube.json
          if-no-files-found: warn

  # Every code block in the README, each in its own job, all at once. Mondays,
  # and on request. Wall clock is the slowest block instead of the sum of all.
  plan:
    name: List the README blocks
    if: github.event.schedule == '0 8 * * 1' || inputs.validate == true
    runs-on: ubuntu-latest
    outputs:
      blocks: ${{ steps.list.outputs.blocks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - id: list
        env:
          ONLY: ${{ inputs.only }}
        run: node .github/scripts/readme_blocks.mjs list >> "$GITHUB_OUTPUT"

  block:
    name: "${{ matrix.n }}. ${{ matrix.title }}"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75  # a block may run two 15-minute searches back to back, and gets one retry
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.blocks) }}
    env:
      BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
      - name: Install the package and, for CLI blocks, the Bright Data CLI
        env:
          LANG_: ${{ matrix.lang }}
        run: |
          npm install
          npm link  # puts youtube-scraper on PATH, for the README's CLI block
          if [ "$LANG_" = "bash" ]; then npm i -g "@brightdata/cli@$BDATA_CLI"; fi
      - name: Run block ${{ matrix.n }} exactly as the README shows it
        env:
          N: ${{ matrix.n }}
        run: |
          set -o pipefail  # without this, tee's exit code hides a failing block
          node .github/scripts/readme_blocks.mjs run "$N" | tee -a "$GITHUB_STEP_SUMMARY"

  cli-syntax:
    name: Does the newest CLI still accept the README's commands?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # no secret here on purpose: this job runs whatever npm calls latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install the newest CLI, as a reader's npx would
        run: |
          npm i -g @brightdata/cli@latest
          latest=$(bdata --version)
          echo "Newest CLI: $latest. Pinned for the live jobs: $BDATA_CLI."
          if [ "$latest" != "$BDATA_CLI" ]; then
            echo "::warning::@brightdata/cli $latest is out; the live jobs still pin $BDATA_CLI. Bump BDATA_CLI in live.yml once this job passes."
          fi
      - name: Run each README CLI line with a key the API rejects
        env:
          BDATA_CLI: ""  # use the newest, not the pin
        run: |
          set -o pipefail
          node .github/scripts/readme_blocks.mjs cli-syntax | tee -a "$GITHUB_STEP_SUMMARY"

  badge:
    name: Put today's date on the README's "last verified" badge
    needs: [scrape, plan, block, cli-syntax]
    # scheduled and manual runs on main only, and only in the main repository: a
    # push is never followed by a bot commit, a copy never diverges from the
    # original, and a manual run on a branch never tries to push main
    # `inputs.only` empty as well: one block passing is not the README verified.
    if: always() && !cancelled() && github.event_name != 'push' && inputs.only == '' && github.repository == 'brightdata/youtube-scraper-node' && github.ref == 'refs/heads/main'
    permissions:
      contents: write  # commits the badge line
      actions: read    # counts this run's job results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Rewrite one badge line, commit only if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Two states: red only when every check in this run failed. One passing
          # check keeps the badge green; the run itself still shows which failed.
          read -r passed failed < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '[.jobs[] | select((.name | startswith("Put today") or startswith("Open or update") or . == "List the README blocks") | not)] as $j | "\([$j[] | select(.conclusion == "success")] | length) \([$j[] | select(.conclusion == "failure")] | length)"') || true
          echo "checks passed: ${passed:-0}, failed: ${failed:-0}"
          if [ "${passed:-0}" -gt 0 ]; then
            label="last verified"; color="brightgreen"
          else
            label="last check failed"; color="red"
          fi
          today=$(date -u +'%-d %b %Y')
          line="[![${label}](https://img.shields.io/badge/${label// /%20}-${today// /%20}-${color})](https://github.com/brightdata/youtube-scraper-node/actions/workflows/live.yml) <!-- verified: rewritten by the daily run -->"
          python3 - "$line" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("README.md"); t = p.read_text(encoding="utf-8")
          new, n = re.subn(r"^\[!\[last [^\]]*\]\(https://img\.shields\.io/badge/[^)]*\)\]\([^)]*\) <!-- verified:[^\n]*$", sys.argv[1], t, count=1, flags=re.M)
          if n != 1:
              sys.exit("the badge line is missing from README.md")
          p.write_text(new, encoding="utf-8")
          PY
          if git diff --quiet; then echo "badge already shows $today"; exit 0; fi
          git config user.name "anil-bd"
          git config user.email "210667061+anil-bd@users.noreply.github.com"
          git commit -qam "${label^} $today (automated daily check)"
          git pull -q --rebase origin main
          git push -q origin main
          echo "badge now shows: $label, $today"

  # A red scheduled run used to show only as a red badge. Open one issue and keep
  # adding to it, so a failure reaches the people watching the repository.
  alert:
    name: Open or update the live-check issue
    needs: [scrape, block, cli-syntax]
    if: failure() && github.event_name == 'schedule' && github.repository == 'brightdata/youtube-scraper-node'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: "scrape ${{ needs.scrape.result }}, README blocks ${{ needs.block.result }}, CLI syntax ${{ needs.cli-syntax.result }}"
        run: |
          title="Live check is failing"
          body="$(date -u +'%-d %b %Y'): $RESULTS. $RUN"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
